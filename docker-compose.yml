services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: bpkad_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      AUTO_MIGRATE: "true"
    volumes:
      - ./:/var/www
    networks:
      - bpkad_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: bpkad_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bpkad_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: bpkad_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "511040"
      MYSQL_DATABASE: bpkad_surat
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bpkad_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p511040 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bpkad_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - bpkad_network
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: bpkad_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bpkad_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: bpkad_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - bpkad_network

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: bpkad_vite
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["npm"]
    command: ["run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
    networks:
      - bpkad_network
    depends_on:
      - app
    profiles:
      - dev

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  bpkad_network:
    driver: bridge
